<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Antique+Soft&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>鬼滅の刃 // DEMON SLAYER CORPS SELECTOR</title>
  </head>
  <body>
    <!-- Fondo nocturno Taisho con luna y rejilla -->
    <div class="bg-night"></div>
    <div class="moon"></div>
    <bg-particles></bg-particles>
    <div class="scanlines"></div>

    <div class="app-container">
      <hud-header></hud-header>

      <main class="hud-main">
        <!-- Contenedor de Tarjetas de Personajes -->
        <section class="select-section">
          <div class="section-title-wrap">
            <span class="title-sub-label"
              >選 // SELECCIONA A TU ESPADACHÍN</span
            >
            <h2 class="section-title">選べ // ELIGE</h2>
          </div>

          <div class="cards-container" id="cards-container">
            <slayer-card
              character="tanjiro"
              name-kanji="竈門 炭治郎"
              name-romaji="TANJIRO KAMADO"
              rank="Kanoe // 丙"
              breathing-style="水の呼吸 // WATER"
              breathing-kanji="水"
              image="https://i.pinimg.com/1200x/cf/87/20/cf87203e0da4b566701291d90fa284dd.jpg"
              image-alt="Tanjiro Kamado"
              effect="water"
              checked
            ></slayer-card>

            <slayer-card
              character="zenitsu"
              name-kanji="我妻 善逸"
              name-romaji="ZENITSU AGATSUMA"
              rank="Kanoe // 丙"
              breathing-style="雷の呼吸 // THUNDER"
              breathing-kanji="雷"
              image="https://i.pinimg.com/1200x/ab/a9/1b/aba91ba6ca5a3f9c71485172aad60baf.jpg"
              image-alt="Zenitsu Agatsuma"
              effect="thunder"
            ></slayer-card>

            <slayer-card
              character="inosuke"
              name-kanji="嘴平 伊之助"
              name-romaji="INOSUKE HASHIBIRA"
              rank="Tsuchinoto // 卯"
              breathing-style="獣の呼吸 // BEAST"
              breathing-kanji="獣"
              image="https://i.pinimg.com/1200x/5c/2b/24/5c2b24c7eb15b4d247310fe35ce1c95c.jpg"
              image-alt="Inosuke Hashibira"
              effect="beast"
            ></slayer-card>
          </div>
        </section>

        <!-- Panel de Información del Espadachín -->
        <slayer-details></slayer-details>

        <!-- Reproductor de música -->
        <music-player></music-player>
      </main>

      <hud-footer></hud-footer>
    </div>

    <!-- Canvas para partículas -->
    <particle-canvas></particle-canvas>

    <script type="module" src="index.js"></script>
  </body>
</html>
